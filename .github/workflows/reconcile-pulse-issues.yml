name: Reconcile Pulse issues

# Remet en regle les tickets ouverts des depots Pulse : depot conforme au
# produit declare, presence dans le projet, Status initial et Entity.
#
# La logique vit dans `scripts/reconcile-pulse-issues.js`, testee par
# `tests/reconcile-pulse-issues.test.js` (`npm test`). Une limite de debit
# GitHub interrompt le passage avec un avertissement : la reconciliation est
# idempotente et le passage suivant la refait. Le run ne reste en echec que si
# une vraie erreur a ete rencontree avant la limite.

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Dry-run affiche le plan sans modifier les tickets"
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - execute
      lookback-days:
        description: "Retraiter les tickets modifiés depuis ce nombre de jours"
        required: true
        default: "14"
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: reconcile-pulse-issues
  cancel-in-progress: true

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout automation scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts
          persist-credentials: false

      - name: Reconcile repository, project and fields
        uses: actions/github-script@v8
        env:
          RECONCILE_MODE: ${{ inputs.mode || 'execute' }}
          LOOKBACK_DAYS: ${{ inputs['lookback-days'] || '14' }}
        with:
          github-token: ${{ secrets.PROJECT_ROUTER_TOKEN_V2 || secrets.PROJECT_ROUTER_TOKEN }}
          # `github-script` n'effectue aucune reprise par defaut : une
          # coupure reseau d'un instant fait echouer le balayage entier,
          # en `Unhandled error`, hors de la collecte d'erreurs par ticket.
          # L'echec est alors indiscernable d'un vrai probleme.
          retries: 3
          script: |
            const run = require('./scripts/reconcile-pulse-issues.js');
            await run({ github, core });
