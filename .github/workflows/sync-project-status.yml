name: Sync Pulse project status

# Fait avancer la colonne Status du projet Pulse au rythme du code :
#   branche `type/issue-<N>-slug`  ->  En cours
#   PR ouverte (hors brouillon)    ->  A fusionner
#   PR fusionnee                   ->  To build/To push
#
# Le balayage est centralise ici parce que le jeton projet n'existe que dans ce
# depot : `create` et `pull_request` sont des evenements locaux a chaque depot
# et ne peuvent pas declencher un workflow ici.
#
# Ce workflow ne fait qu'avancer. Il n'ajoute jamais un ticket au projet et ne
# pose jamais un statut initial : `route-new-issue` et `reconcile-pulse-issues`
# gardent cette responsabilite, et `reconcile` ne pose le Status que s'il est
# absent — les deux ne se marchent donc pas dessus.
#
# « Avancer » se lit sur l'echelle complete du tableau, statuts de recette
# compris : un ticket deja passe en `A tester`, `Test OK` ou `Termine` n'est
# jamais ramene en arriere. Les mises en attente (`Suspendu`,
# `Version ulterieure`) sont hors echelle et ne sont jamais ecrasees.
#
# La logique vit dans `scripts/sync-project-status.js`, testee par
# `tests/sync-project-status.test.js` (`npm test`). Une limite de debit GitHub
# interrompt le passage avec un avertissement : le balayage est idempotent et
# le passage suivant le refait en entier. Le run ne reste en echec que si une
# vraie erreur a ete rencontree avant la limite.

on:
  schedule:
    # Decale de 5 minutes par rapport a `reconcile-pulse-issues` (7,22,37,52)
    # pour ne pas ecrire dans le projet en meme temps que lui.
    - cron: "2,17,32,47 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Dry-run affiche le plan sans modifier les tickets"
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - execute

permissions:
  contents: read

concurrency:
  group: sync-project-status
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout automation scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts
          persist-credentials: false

      - name: Move tickets along branch, pull request and merge signals
        uses: actions/github-script@v8
        env:
          SYNC_MODE: ${{ inputs.mode || 'execute' }}
        with:
          github-token: ${{ secrets.PROJECT_ROUTER_TOKEN_V2 || secrets.PROJECT_ROUTER_TOKEN }}
          retries: 3
          script: |
            const run = require('./scripts/sync-project-status.js');
            await run({ github, core });
