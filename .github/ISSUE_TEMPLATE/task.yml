---
name: "📌 Task"
description: Planifier une tâche technique ou opérationnelle
type: Task
projects: ["TKorpXR/1"]
body:
  - type: dropdown
    id: product
    attributes:
      label: Produit concerné
      description: Ce choix détermine automatiquement le repository et le champ Entity.
      options:
        - Web
        - Mobile app
        - Desktop
        - MDM Android
        - MDM Serveur
        - VR app
        - Autre
    validations:
      required: true
  - type: dropdown
    id: task-type
    attributes:
      label: Type de tâche
      options:
        - Tests
        - Traduction
        - Sécurité
        - Configuration
        - Refactorisation
        - Documentation
        - Autre
    validations:
      required: true
  - type: input
    id: target
    attributes:
      label: Cible
      description: Indique une URL, un écran, un composant ou un service concerné.
    validations:
      required: false
  - type: textarea
    id: task-description
    attributes:
      label: Description de la tâche
      description: Décris le travail à réaliser et le résultat attendu.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Critères de validation
      description: Indique comment vérifier que la tâche est terminée.
    validations:
      required: false
