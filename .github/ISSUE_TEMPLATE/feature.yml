---
name: "🚀 Feature"
description: Proposer une nouvelle fonctionnalité ou une amélioration
type: Feature
projects: ["TKorpXR/1"]
body:
  - type: dropdown
    id: product
    attributes:
      label: Produit concerné
      description: Ce choix détermine automatiquement le repository et le champ Entity.
      options:
        - Web
        - Mobile app
        - Desktop
        - MDM Android
        - MDM Serveur
        - VR app
        - Autre
    validations:
      required: true
  - type: dropdown
    id: request-type
    attributes:
      label: Type de demande
      options:
        - Amélioration
        - Nouvelle fonctionnalité
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: URL ou écran concerné
      description: Indique une URL, une page, un écran ou un chemin si la demande concerne une zone existante.
      placeholder: https://pulse-xr.com/page-concernee
    validations:
      required: false
  - type: textarea
    id: need
    attributes:
      label: Besoin ou problème à résoudre
      description: Explique le contexte, les utilisateurs concernés et la valeur attendue.
    validations:
      required: true
  - type: textarea
    id: expected-solution
    attributes:
      label: Solution ou résultat attendu
      description: Décris le comportement souhaité et ajoute des captures ou exemples si nécessaire.
    validations:
      required: true
