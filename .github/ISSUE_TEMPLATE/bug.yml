---
name: "💣 Bug"
description: Signaler un dysfonctionnement sur un produit Pulse
type: Bug
body:
  - type: dropdown
    id: product
    attributes:
      label: Produit concerné
      description: Ce choix détermine automatiquement le repository et le champ Entity.
      options:
        - Web
        - Mobile app
        - Desktop
        - MDM Android
        - MDM Serveur
        - VR app
        - Autre
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environnement
      options:
        - Production
        - Préproduction
        - Développement / local
        - Non déterminé
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: URL ou écran concerné
      description: Indique une URL, une page, un écran ou un chemin permettant de localiser le problème.
      placeholder: https://pulse-xr.com/page-concernee
    validations:
      required: false
  - type: textarea
    id: bug-description
    attributes:
      label: Description du problème
      description: Décris précisément ce qui se passe et ajoute des captures ou des logs si nécessaire.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Étapes de reproduction
      description: Liste les actions permettant de reproduire le problème.
      placeholder: |
        1. Ouvrir…
        2. Cliquer sur…
        3. Constater…
    validations:
      required: false
  - type: textarea
    id: expected
    attributes:
      label: Comportement attendu
    validations:
      required: true
